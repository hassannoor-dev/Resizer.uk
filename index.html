<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- TIP: the icon iPhones and iPads use for "Add to Home Screen". The file lives in public/apple-touch-icon.png -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#60b0f0" />

    <!-- TIP: keep this title + description identical to homePage in src/data/meta.js. The app swaps them per page once it loads. -->
    <title>Resize any image for any platform | Resizer</title>
    <meta name="description" content="Free image resizer with ready-made sizes for LinkedIn, Facebook, YouTube, Instagram and X. No signup, and your photos never leave your device." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- TIP: usePageMeta.js finds this tag and updates it per page, so only the home URL goes here -->
    <link rel="canonical" href="https://resizer.uk/" />

    <!-- Open Graph: the link card on WhatsApp, Facebook, LinkedIn, Discord, iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Resizer" />
    <meta property="og:title" content="Resize any image for any platform | Resizer" />
    <meta property="og:description" content="Free image resizer with ready-made sizes for LinkedIn, Facebook, YouTube, Instagram and X. No signup, and your photos never leave your device." />
    <meta property="og:url" content="https://resizer.uk/" />
    <!-- TIP: must be a full https:// address (not /og-image.png), 1200x630 px, PNG or JPG, under 1 MB. Put the file at public/og-image.png -->
    <meta property="og:image" content="https://resizer.uk/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Resizer: resize any image for LinkedIn, Facebook, YouTube, Instagram and X" />

    <!-- X / Twitter card (falls back to the og: tags above for everything else) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Resize any image for any platform | Resizer" />
    <meta name="twitter:description" content="Free image resizer with ready-made sizes for LinkedIn, Facebook, YouTube, Instagram and X. No signup." />
    <meta name="twitter:image" content="https://resizer.uk/og-image.png" />

    <!-- Structured data: tells Google and AI search engines exactly what this site is -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Resizer",
        "url": "https://resizer.uk/",
        "description": "Free online image resizer with exact sizes for LinkedIn, Facebook, YouTube, Instagram and X. Photos are processed in your browser and never uploaded.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any (runs in the browser)",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Exact sizes for profile pictures, banners, thumbnails, posts and stories",
          "Fit or fill the frame, with blur, edge stretch, mirror or solid color fill",
          "Download as PNG or JPG",
          "No signup, and photos never leave your device"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- TIP: display=swap shows text immediately instead of waiting for the fonts (it was missing before) -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- TIP: crawlers and AI bots that don't run JavaScript read this. Normal visitors never see it. -->
    <noscript>
      <h1>Resize any image for any platform</h1>
      <p>Free image resizer with exact sizes for LinkedIn, Facebook, YouTube, Instagram and X. No signup, and your photos never leave your device. JavaScript is needed to use the tool.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
